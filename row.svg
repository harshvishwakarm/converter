<!-- Save as icon-U-pro.svg -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">U Icon Professional</title>
  <desc id="desc">Circular gradient icon with larger white U in center.</desc>

  <defs>
    <!-- professional gradient: dark blue to cyan -->
    <linearGradient id="grad-pro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d47a1"/>   <!-- deep blue -->
      <stop offset="1" stop-color="#00bcd4"/>   <!-- cyan -->
    </linearGradient>

    <!-- glossy highlight -->
    <radialGradient id="grad-highlight" cx="35%" cy="25%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- soft shadow -->
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- circular background -->
  <g filter="url(#drop-shadow)">
    <circle cx="256" cy="256" r="220" fill="url(#grad-pro)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <circle cx="256" cy="256" r="220" fill="url(#grad-highlight)" />
  </g>

  <!-- Bigger U -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle"
        font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="270" fill="#FFFFFF" letter-spacing="3">
    U
  </text>
</svg>
